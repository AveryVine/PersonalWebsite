<style>
    @font-face {
        font-family: workSans;
        src: url(/fonts/WorkSans/WorkSans-VariableFont_wght.ttf);
    }

    @font-face {
        font-family: nunitoSans;
        src: url(/fonts/NunitoSans/NunitoSans-VariableFont_YTLC,opsz,wdth,wght.ttf);
    }

    /* Anchored to :root rather than a bare [data-bs-theme] selector. Ignite stamps
       data-bs-theme onto the navbar and its dropdown to pin their internal Bootstrap
       styling, and a bare selector would let those subtrees re-pick the wrong palette. */
    :root {
        --site-bg: #F5F5F5;
        --site-rule: black;

        --site-accent: #e56429;
        --site-accent-hover: #e84e06;
        --site-accent-soft: #e87743;
        --site-accent-soft-hover: #e56429;
        --site-accent-strong: #cc4a0e;
        --site-accent-strong-hover: #b2420e;
        --site-accent-contrast: #f5f5f5;
        --site-rss: #f26522;
    }

    :root[data-bs-theme="dark"] {
        --site-bg: #262626;
        --site-rule: #ffffff;

        --site-accent: #cc693b;
        --site-accent-hover: #e87743;
        --site-accent-soft: #c95824;
        --site-accent-soft-hover: #cc693b;
        --site-accent-strong: #b4410c;
        --site-accent-strong-hover: #9d3a0c;
        --site-accent-contrast: #ffffff;
        --site-rss: #d6591e;

        --bs-body-bg: #262626;
        --bs-body-bg-rgb: 38, 38, 38;
        --bs-body-color: #ffffff;
        --bs-body-color-rgb: 255, 255, 255;
    }

    body {
        font-family: nunitoSans, sans-serif;
        background: var(--site-bg);
    }

    h1, h2, h3, h4, h5, h6 {
        font-family: workSans, sans-serif;
        font-weight: normal;
    }

    .underlined {
        border-bottom: 3px solid var(--site-rule);
    }

    a {
        color: var(--site-accent);
    }

    a:hover {
        color: var(--site-accent-hover);
    }

    a:link {
        text-decoration: none;
    }

    .recent-post-title a {
        color: var(--bs-body-color);
    }

    .navbar {
        font-family: workSans, sans-serif;
        font-size: 18px;
        font-weight: 500;
        box-shadow: 0px 10px 20px rgba(0, 0, 0, 0.4);
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
    }

    .navbar .dropdown-menu {
        background: var(--site-accent-strong);
        --bs-dropdown-border-radius: 4px;
        --bs-dropdown-border-color: var(--site-accent-strong);
        --bs-border-color-translucent: var(--site-accent-strong-hover);
    }

    .navbar .dropdown-menu a:hover {
        background: var(--site-accent-strong-hover);
        color: var(--bs-nav-link-hover-color);
    }

    .navbar .dropdown-item {
        color: var(--bs-nav-link-color);
    }

    .badge {
        font-family: workSans, sans-serif;
        font-weight: 500;
        padding: 7px 9px;
        transition: background-color .15s ease-in-out,box-shadow .15s ease-in-out;
        --bs-primary-text-emphasis: var(--site-accent-contrast);
        --bs-primary-bg-subtle: var(--site-accent-soft);
        background-color: --bs-primary-bg-subtle;
    }

    .badge:hover {
        --bs-primary-bg-subtle: var(--site-accent-soft-hover);
        --bs-primary-text-emphasis: var(--site-accent-contrast);
        background-color: --bs-primary-bg-subtle;
    }

    .btn {
        --bs-btn-bg: var(--site-accent-soft);
        --bs-btn-border-color: var(--site-accent-soft);
        --bs-btn-hover-bg: var(--site-accent-soft-hover);
        --bs-btn-hover-border-color: var(--site-accent-soft-hover);
        --bs-btn-active-bg: var(--site-accent-soft-hover);
        --bs-btn-active-border-color: var(--site-accent-soft-hover);
        --bs-accordion-active-bg: var(--site-accent-soft);
    }

    .title-image {
        background-position: left 50px;
        background-attachment: fixed;
        background-repeat: no-repeat;
        background-size: max(100vw, 500px);

        border-bottom: 1px solid black;

        position: absolute;
        height: 100%;
        top: 0px;
        left: calc(0px - ((100vw - 100%) / 2));
        width: 100vw;
        z-index: -9999;
    }

    .title-image-container {
        position: relative;
        padding-top: 50px;
        margin-top: -50px;
    }

    #home-title-image {
        background-image: linear-gradient(
        rgba(0, 0, 0, 0.4),
        rgba(0, 0, 0, 0.4)
        ), url("/images/TitleImage.jpg");
    }

    #cyclo-title-image {
        background-image: url("/images/cyclo-title-image.png");
    }

    #cyclo-title-image-container {
        height: 400px;
    }

    #droplet-title-image {
        background-image: url("/images/droplet-title-image.png");
        background-position: center 70px;
    }

    #droplet-title-image-container {
        height: 400px;
    }

    @media(min-width: 768px) {
        .navbar-brand {
            margin-left: 20px;
        }

        .navbar .dropdown-menu {
            --bs-dropdown-border-color: var(--bs-border-color-translucent);
        }
    }

    @media(max-width: 400px) {
        .badge-detail {
            display: none;
        }
    }

    @media(max-width: 1024px) {
        #cyclo-title-image-container {
            height: 220px;
        }

        #droplet-title-image-container {
            height: 220px;
        }
    }
</style>
